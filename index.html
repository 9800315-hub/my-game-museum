<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="遊戲收藏博物館：依遊戲推薦文章整理值得認識的遊戲。"
    />
    <title>遊戲收藏博物館｜Game Museum</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="container nav" aria-label="主要導覽">
        <a class="logo" href="#top"
          ><span aria-hidden="true">🎮</span> 遊戲收藏博物館</a
        >
        <div class="navlinks">
          <a href="#collection">遊戲收藏</a>
          <a href="#about">關於本站</a>
        </div>
      </nav>
    </header>
    <main class="container" id="top">
      <section class="hero">
        <div class="eyebrow">THE GAME SHELF · 01</div>
        <h1>遊戲收藏<br />博物館</h1>
        <p>
          依據遊戲推薦文章整理館藏，讓作品特色與推薦理由一目了然。點選卡片查看詳細介紹。
        </p>
        <a class="btn" href="#collection">瀏覽遊戲收藏 ↓</a>
      </section>
      <section class="stats" aria-label="收藏數量">
        <div class="stat">
          <strong data-stat="total">—</strong><span>收藏數量</span>
        </div>
      </section>
      <section id="collection" aria-labelledby="collection-heading">
        <div class="sectionhead">
          <h2 id="collection-heading">✦ 遊戲收藏</h2>
          <span class="subtle" id="result-count" aria-live="polite"></span>
        </div>
        <div class="filters">
          <label
            ><span class="filter-label">搜尋遊戲</span
            ><input id="search" type="search" placeholder="輸入遊戲名稱…"
          /></label>
          <label
            ><span class="filter-label">遊戲類型</span
            ><select id="genre">
              <option value="">所有類型</option>
            </select></label
          >
        </div>
        <div class="cards" id="game-list" aria-live="polite">
          <div class="empty">正在載入遊戲…</div>
        </div>
      </section>
      <section id="about" class="about-panel">
        <h2>關於這座收藏館</h2>
        <p>
          館藏介紹與評分依據推薦文章及可確認的遊戲資訊整理；推薦評析不代表個人遊玩紀錄，未確認的內容不會寫成事實。
        </p>
      </section>
    </main>
    <footer class="container">✦ 遊戲收藏博物館 · 依推薦文章持續整理 ✦</footer>
    <dialog id="game-dialog" class="game-dialog" aria-labelledby="dialog-title">
      <button
        type="button"
        class="dialog-close"
        id="dialog-close"
        aria-label="關閉遊戲詳細資訊"
      >
        ×
      </button>
      <div id="dialog-content"></div>
    </dialog>
    <script src="js/main.js" defer></script>
  </body>
</html>
